name: Backend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GCP retention policy
        working-directory: .
        run: |
          bash -n scripts/gcp/cleanup-retention.sh tests/gcp/cleanup-retention.sh
          ./tests/gcp/cleanup-retention.sh

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Build backend artifact
        run: ./gradlew clean assemble --no-daemon

      - name: Upload backend build outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-build-${{ github.run_number }}
          path: |
            backend/build/libs/*.jar
            backend/build/reports/problems/**
          if-no-files-found: warn
          retention-days: 14

  unit-tests:
    name: Unit Tests and Coverage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Run unit tests and coverage gate
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Collect centralized unit test results
        if: always()
        working-directory: .
        run: |
          status=failed
          if [ "${{ job.status }}" = success ]; then status=passed; fi
          if [ "${{ job.status }}" = cancelled ]; then status=cancelled; fi
          python3 scripts/testing/collect_test_results.py \
            --suite backend/unit \
            --status "$status" \
            --junit backend/build/test-results/test \
            --copy junit=backend/build/test-results/test \
            --copy html=backend/build/reports/tests/test \
            --copy coverage=backend/build/reports/jacoco/test \
            --metadata "workflow=Backend CI" \
            --metadata "run=${{ github.run_id }}" \
            --metadata "sha=${{ github.sha }}"

      - name: Upload centralized unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-backend-unit-${{ github.run_number }}
          path: test-results/backend/unit/**
          if-no-files-found: error
          retention-days: 14

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Run API contract tests
        run: ./gradlew apiTest --no-daemon

      - name: Collect centralized API test results
        if: always()
        working-directory: .
        run: |
          status=failed
          if [ "${{ job.status }}" = success ]; then status=passed; fi
          if [ "${{ job.status }}" = cancelled ]; then status=cancelled; fi
          python3 scripts/testing/collect_test_results.py \
            --suite backend/api \
            --status "$status" \
            --junit backend/build/test-results/apiTest \
            --copy junit=backend/build/test-results/apiTest \
            --copy html=backend/build/reports/tests/apiTest \
            --copy diagnostics=backend/build/reports/problems \
            --metadata "workflow=Backend CI" \
            --metadata "run=${{ github.run_id }}" \
            --metadata "sha=${{ github.sha }}"

      - name: Upload centralized API test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-backend-api-${{ github.run_number }}
          path: test-results/backend/api/**
          if-no-files-found: error
          retention-days: 14

  integration-tests:
    name: Integration Tests and Coverage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Run integration tests with JaCoCo
        run: ./gradlew integrationTest --no-daemon

      - name: Collect centralized integration test results
        if: always()
        working-directory: .
        run: |
          status=failed
          if [ "${{ job.status }}" = success ]; then status=passed; fi
          if [ "${{ job.status }}" = cancelled ]; then status=cancelled; fi
          python3 scripts/testing/collect_test_results.py \
            --suite backend/integration \
            --status "$status" \
            --junit backend/build/test-results/integrationTest \
            --copy junit=backend/build/test-results/integrationTest \
            --copy html=backend/build/reports/tests/integrationTest \
            --copy coverage=backend/build/reports/jacoco/integrationTest \
            --copy diagnostics=backend/build/reports/problems \
            --metadata "workflow=Backend CI" \
            --metadata "run=${{ github.run_id }}" \
            --metadata "sha=${{ github.sha }}"

      - name: Upload centralized integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-backend-integration-${{ github.run_number }}
          path: test-results/backend/integration/**
          if-no-files-found: error
          retention-days: 14

      - name: Summarize integration evidence
        if: always()
        run: |
          {
            echo "## Integration evidence"
            echo ""
            echo "- Command: \`./gradlew integrationTest --no-daemon\`"
            echo "- Central path: \`test-results/backend/integration/\`"
            echo "- Exportable summary: \`summary.json\` and \`metrics.prom\`"
            echo "- Artifact: \`test-results-backend-integration-${{ github.run_number }}\`"
            echo "- Testcontainers diagnostics are available in the uploaded reports when environment-dependent failures occur"
          } >> "$GITHUB_STEP_SUMMARY"
