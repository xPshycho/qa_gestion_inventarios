name: GCP Managed Environment Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Managed GCP environment to deploy.
        required: true
        type: string
      workload_identity_provider:
        description: Branch-scoped Workload Identity provider.
        required: true
        type: string
      deploy_service_account:
        description: Environment-specific deploy service account.
        required: true
        type: string
      deploy_services:
        description: Activate Cloud Run after foundation, images and secrets.
        required: false
        default: false
        type: boolean
      apply_platform:
        description: Reconcile the shared platform before the environment.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-managed-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} with OpenTofu
    if: inputs.environment == 'development' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      CLOUD_SQL_PROXY_IMAGE: ${{ vars.GCP_CLOUD_SQL_PROXY_IMAGE }}
      DEPLOY_SERVICES: ${{ inputs.deploy_services }}
      DEPLOY_SERVICE_ACCOUNT: ${{ inputs.deploy_service_account }}
      DEVELOPMENT_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEVELOPMENT_DEPLOY_SERVICE_ACCOUNT }}
      STAGING_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}

    steps:
      - name: Validate branch and non-sensitive configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_ref="refs/heads/${{ inputs.environment == 'development' && 'develop' || 'staging' }}"
          [[ "$GITHUB_REF" == "$expected_ref" ]]
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$GCP_REGION" =~ ^[a-z]+-[a-z0-9]+[0-9]$ ]]
          [[ "$GCP_STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$ ]]
          [[ "$GCP_ARTIFACT_REPOSITORY" =~ ^[a-z][a-z0-9-]{2,61}[a-z0-9]$ ]]
          [[ "${{ inputs.workload_identity_provider }}" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9_-]+/providers/[A-Za-z0-9_-]+$ ]]
          [[ "$DEPLOY_SERVICE_ACCOUNT" =~ ^[A-Za-z0-9._+-]+@$GCP_PROJECT_ID\.iam\.gserviceaccount\.com$ ]]
          [[ "$DEVELOPMENT_DEPLOY_SERVICE_ACCOUNT" =~ ^[A-Za-z0-9._+-]+@$GCP_PROJECT_ID\.iam\.gserviceaccount\.com$ ]]
          [[ "$STAGING_DEPLOY_SERVICE_ACCOUNT" =~ ^[A-Za-z0-9._+-]+@$GCP_PROJECT_ID\.iam\.gserviceaccount\.com$ ]]
          [[ "$CLOUD_SQL_PROXY_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]

      - name: Checkout exact deployment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate with branch-scoped Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.deploy_service_account }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up OpenTofu 1.12.5
        uses: opentofu/setup-opentofu@e95ccdd20623115bfd7d47df14a3250d6066a9d0 # v1.0.7
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Plan and apply shared platform exactly
        if: inputs.apply_platform
        run: |
          set -Eeuo pipefail
          config_dir="$RUNNER_TEMP/opentofu/platform"
          ./scripts/opentofu/render-ci-config.sh platform "$config_dir"
          ./scripts/opentofu/plan.sh \
            platform \
            "$config_dir/backend.hcl" \
            "$config_dir/terraform.tfvars" \
            "$RUNNER_TEMP/platform.tfplan"
          tofu -chdir=infra/opentofu/platform apply \
            -input=false \
            -auto-approve \
            "$RUNNER_TEMP/platform.tfplan"

      - name: Build and publish SHA-tagged images
        id: images
        run: |
          set -Eeuo pipefail
          registry="$GCP_REGION-docker.pkg.dev"
          image_root="$registry/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY"
          gcloud auth configure-docker "$registry" --quiet

          docker build --pull --tag "$image_root/frontend:$GITHUB_SHA" frontend
          docker build --pull --tag "$image_root/backend:$GITHUB_SHA" backend
          docker build --pull --tag "$image_root/keycloak:$GITHUB_SHA" infra/keycloak

          for component in frontend backend keycloak; do
            docker push "$image_root/$component:$GITHUB_SHA"
          done

          for component in frontend backend keycloak; do
            digest="$(
              gcloud artifacts docker images describe \
                "$image_root/$component:$GITHUB_SHA" \
                --format='value(image_summary.digest)'
            )"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            variable_name="${component^^}_IMAGE"
            printf '%s=%s@%s\n' "$variable_name" "$image_root/$component" "$digest" >>"$GITHUB_ENV"
          done

      - name: Plan and apply private foundation exactly
        env:
          DEPLOY_SERVICES: "false"
        run: |
          set -Eeuo pipefail
          config_dir="$RUNNER_TEMP/opentofu/${{ inputs.environment }}"
          ./scripts/opentofu/render-ci-config.sh "${{ inputs.environment }}" "$config_dir"
          ./scripts/opentofu/plan.sh \
            "${{ inputs.environment }}" \
            "$config_dir/backend.hcl" \
            "$config_dir/terraform.tfvars" \
            "$RUNNER_TEMP/${{ inputs.environment }}-foundation.tfplan"
          tofu -chdir="infra/opentofu/environments/${{ inputs.environment }}" apply \
            -input=false \
            -auto-approve \
            "$RUNNER_TEMP/${{ inputs.environment }}-foundation.tfplan"

      - name: Seed first runtime secret versions and database users
        id: secrets
        if: inputs.deploy_services
        env:
          INVENTORY_DB_PASSWORD: ${{ secrets.INVENTORY_DB_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_OPERATOR_PASSWORD: ${{ secrets.E2E_OPERATOR_PASSWORD }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
          E2E_AUDITOR_PASSWORD: ${{ secrets.E2E_AUDITOR_PASSWORD }}
        run: |
          set -Eeuo pipefail
          secret_version="$(./scripts/opentofu/seed-runtime-secrets.sh "${{ inputs.environment }}")"
          echo "SECRET_VERSION=$secret_version" >>"$GITHUB_ENV"

      - name: Plan and apply Cloud Run services exactly
        if: inputs.deploy_services
        env:
          DEPLOY_SERVICES: "true"
        run: |
          set -Eeuo pipefail
          config_dir="$RUNNER_TEMP/opentofu/${{ inputs.environment }}-services"
          ./scripts/opentofu/render-ci-config.sh "${{ inputs.environment }}" "$config_dir"
          ./scripts/opentofu/plan.sh \
            "${{ inputs.environment }}" \
            "$config_dir/backend.hcl" \
            "$config_dir/terraform.tfvars" \
            "$RUNNER_TEMP/${{ inputs.environment }}-services.tfplan"
          tofu -chdir="infra/opentofu/environments/${{ inputs.environment }}" apply \
            -input=false \
            -auto-approve \
            "$RUNNER_TEMP/${{ inputs.environment }}-services.tfplan"

      - name: Validate deployed Cloud Run endpoints
        if: inputs.deploy_services
        run: |
          set -Eeuo pipefail
          root="infra/opentofu/environments/${{ inputs.environment }}"
          web_url="$(tofu -chdir="$root" output -json environment | jq -r '.service_urls.web')"
          identity_url="$(tofu -chdir="$root" output -json environment | jq -r '.service_urls.identity')"
          [[ "$web_url" == https://* ]]
          [[ "$identity_url" == https://* ]]
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 10 "$web_url/health" >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 10 \
            "$identity_url/realms/inventory/.well-known/openid-configuration" >/dev/null

      - name: Collect sanitized deployment evidence
        if: always()
        run: |
          set -Eeuo pipefail
          evidence_dir="test-results/gcp-managed/${{ inputs.environment }}"
          mkdir -p "$evidence_dir"
          root="infra/opentofu/environments/${{ inputs.environment }}"

          if tofu -chdir="$root" output -json environment >"$evidence_dir/opentofu-output.json"; then
            jq --sort-keys . "$evidence_dir/opentofu-output.json" \
              >"$evidence_dir/opentofu-output.sorted.json"
            mv "$evidence_dir/opentofu-output.sorted.json" "$evidence_dir/opentofu-output.json"
          fi

          jq -n \
            --arg environment "${{ inputs.environment }}" \
            --arg deployed_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg cloud_run_enabled "${{ inputs.deploy_services }}" \
            '{
              environment: $environment,
              deployed_sha: $deployed_sha,
              run_id: $run_id,
              run_attempt: $run_attempt,
              cloud_run_enabled: ($cloud_run_enabled == "true")
            }' >"$evidence_dir/deployment.json"

      - name: Verify evidence safety
        if: always()
        id: evidence_safety
        env:
          INVENTORY_SECRET_ENV_OUTPUT: ${{ runner.temp }}/artifact-safety.env
          INVENTORY_SECRET_ENV_FILE: ${{ runner.temp }}/artifact-safety.env
          POSTGRES_PASSWORD: ${{ secrets.INVENTORY_DB_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_OPERATOR_PASSWORD: ${{ secrets.E2E_OPERATOR_PASSWORD }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}
          E2E_AUDITOR_PASSWORD: ${{ secrets.E2E_AUDITOR_PASSWORD }}
        run: |
          set -Eeuo pipefail
          ./scripts/security/init-secret-env.sh local --rotate
          ./scripts/security/verify-artifacts.sh test-results/gcp-managed

      - name: Upload safe deployment evidence
        if: always() && steps.evidence_safety.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcp-managed-${{ inputs.environment }}-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/gcp-managed
          if-no-files-found: error
          retention-days: 30
