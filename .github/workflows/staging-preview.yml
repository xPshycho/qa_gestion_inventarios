name: Staging Preview

on:
  workflow_call:
    inputs:
      deploy_ref:
        description: Commit, tag or branch to deploy
        required: false
        type: string
        default: ''
      run_zap:
        description: Run the ZAP baseline inside the staging preview
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: staging-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-validate:
    name: Deploy and validate runner-private staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      COMPOSE_PROJECT_NAME: inventory-staging-${{ github.run_id }}-${{ github.run_attempt }}
      STAGING_DEPLOYMENT_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      STAGING_LIFECYCLE: ephemeral
      STAGING_VISIBILITY: runner-private
      STAGING_RUN_ZAP: ${{ inputs.run_zap }}

    steps:
      - name: Checkout deployment revision
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.deploy_ref || github.sha }}

      - name: Enforce staging as the source of main promotions
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PROMOTION_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PROMOTION_SOURCE: ${{ github.head_ref }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$PROMOTION_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
            echo "::error::Promotions to main must originate in this repository."
            exit 1
          fi
          if [ "$PROMOTION_SOURCE" != staging ]; then
            echo "::error::PRs targeting main must originate from staging. Merge this branch into staging first."
            exit 1
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm 10.12.1
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright browser
        working-directory: tests/e2e
        run: |
          CHROME_PATH="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$CHROME_PATH" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          else
            pnpm exec playwright install chromium
          fi

      - name: Record the exact deployed revision
        id: revision
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          DEPLOYED_SHA="$(git rev-parse HEAD)"
          echo "APP_VERSION=$DEPLOYED_SHA" >> "$GITHUB_ENV"
          echo "DEPLOYED_SHA=$DEPLOYED_SHA" >> "$GITHUB_ENV"
          echo "sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build cached application images in parallel
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          files: docker-bake.hcl
          targets: backend,frontend
          load: true
          provenance: false
          set: |
            backend.tags=inventory-backend:${{ steps.revision.outputs.sha }}
            backend.cache-from=type=gha,scope=inventory-staging-backend
            backend.cache-to=type=gha,mode=max,scope=inventory-staging-backend,ignore-error=true
            frontend.tags=inventory-frontend:${{ steps.revision.outputs.sha }}
            frontend.cache-from=type=gha,scope=inventory-staging-frontend
            frontend.cache-to=type=gha,mode=max,scope=inventory-staging-frontend,ignore-error=true

      - name: Generate ephemeral staging secrets
        run: |
          ./scripts/staging/init-env.sh --force
          for variable in \
            POSTGRES_PASSWORD \
            KEYCLOAK_DB_PASSWORD \
            KEYCLOAK_ADMIN_PASSWORD \
            KEYCLOAK_ADMIN_CLIENT_SECRET \
            E2E_ADMIN_PASSWORD \
            E2E_OPERATOR_PASSWORD \
            E2E_VIEWER_PASSWORD \
            E2E_AUDITOR_PASSWORD \
            GRAFANA_ADMIN_PASSWORD; do
            value="$(awk -F= -v key="$variable" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' .staging/staging.env)"
            test -n "$value"
            echo "::add-mask::$value"
          done

      - name: Validate staging Compose model
        run: >-
          docker compose
          --env-file .staging/staging.env
          --project-name "$COMPOSE_PROJECT_NAME"
          --file docker-compose.yml
          --file docker-compose.staging.yml
          config --quiet

      - name: Deploy staging preview
        id: deploy
        continue-on-error: true
        run: ./scripts/staging/deploy.sh --no-build

      - name: Run mandatory post-deploy gate
        id: post_deploy
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: ./scripts/staging/post-deploy.sh

      - name: Collect deployment diagnostics
        id: final_collection
        if: always() && steps.deploy.outcome != 'skipped'
        continue-on-error: true
        run: ./scripts/staging/collect-evidence.sh

      - name: Verify evidence is safe to publish
        id: evidence_safety
        if: always() && steps.deploy.outcome != 'skipped'
        continue-on-error: true
        run: ./scripts/staging/verify-evidence-safety.sh

      - name: Collect centralized staging results
        id: centralized_results
        if: always() && steps.deploy.outcome != 'skipped'
        continue-on-error: true
        run: |
          status=failed
          if [ "${{ steps.deploy.outcome }}" = success ] \
            && [ "${{ steps.post_deploy.outcome }}" = success ] \
            && [ "${{ steps.final_collection.outcome }}" = success ] \
            && [ "${{ steps.evidence_safety.outcome }}" = success ]; then
            status=passed
          fi
          evidence_arguments=()
          if [ "${{ steps.evidence_safety.outcome }}" = success ]; then
            evidence_arguments+=(--copy evidence=.staging/evidence)
          fi
          python3 scripts/testing/collect_test_results.py \
            --suite staging/post-deploy \
            --status "$status" \
            "${evidence_arguments[@]}" \
            --metadata "workflow=Staging Preview" \
            --metadata "run=${{ github.run_id }}" \
            --metadata "sha=${DEPLOYED_SHA:-${GITHUB_SHA}}"

      - name: Verify centralized staging results
        id: centralized_safety
        if: always() && steps.centralized_results.outcome == 'success'
        continue-on-error: true
        env:
          INVENTORY_SECRET_ENV_FILE: ${{ github.workspace }}/.staging/staging.env
        run: ./scripts/security/verify-artifacts.sh test-results/staging/post-deploy

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## Staging preview"
            echo ""
            echo "- Revision: \`${DEPLOYED_SHA:-unknown}\`"
            echo "- Lifecycle: ephemeral"
            echo "- Visibility: runner-private; URLs use loopback and are not public"
            echo "- Compose project: \`${COMPOSE_PROJECT_NAME}\`"
            echo "- ZAP baseline in preview: \`${STAGING_RUN_ZAP}\`"
            echo "- Artifact: \`test-results-staging-post-deploy-${DEPLOYED_SHA:-unknown}-${GITHUB_RUN_ATTEMPT}\`"
            echo "- Evidence safety: \`${{ steps.evidence_safety.outcome }}\`"
            echo "- Final evidence collection: \`${{ steps.final_collection.outcome }}\`"
            echo "- Central path: \`test-results/staging/post-deploy/\`"
            echo "- Exportable summary: \`summary.json\` and \`metrics.prom\`"
            echo ""
            if [ "${{ steps.evidence_safety.outcome }}" = success ] && \
              [ -f .staging/evidence/post-deploy/summary.md ]; then
              cat .staging/evidence/post-deploy/summary.md
            elif [ "${{ steps.evidence_safety.outcome }}" != success ]; then
              echo "Detailed evidence was withheld because the safety gate did not pass."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging evidence
        if: always() && steps.evidence_safety.outcome == 'success' && steps.centralized_safety.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-staging-post-deploy-${{ env.DEPLOYED_SHA }}-${{ github.run_attempt }}
          path: test-results/staging/post-deploy/**
          if-no-files-found: error
          retention-days: 30

      - name: Destroy ephemeral preview
        if: always() && steps.deploy.outcome != 'skipped'
        continue-on-error: true
        run: ./scripts/staging/destroy.sh --volumes

      - name: Enforce deployment and post-deploy results
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          POST_DEPLOY_OUTCOME: ${{ steps.post_deploy.outcome }}
          EVIDENCE_SAFETY_OUTCOME: ${{ steps.evidence_safety.outcome }}
          FINAL_COLLECTION_OUTCOME: ${{ steps.final_collection.outcome }}
          CENTRALIZED_RESULTS_OUTCOME: ${{ steps.centralized_results.outcome }}
          CENTRALIZED_SAFETY_OUTCOME: ${{ steps.centralized_safety.outcome }}
        run: |
          test "$DEPLOY_OUTCOME" = success
          test "$POST_DEPLOY_OUTCOME" = success
          test "$FINAL_COLLECTION_OUTCOME" = success
          test "$EVIDENCE_SAFETY_OUTCOME" = success
          test "$CENTRALIZED_RESULTS_OUTCOME" = success
          test "$CENTRALIZED_SAFETY_OUTCOME" = success
