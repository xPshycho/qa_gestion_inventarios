name: Security Testing

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional HTTPS staging URL for the ZAP baseline scan'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: security-testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: inventory-security-${{ github.run_id }}

jobs:
  dependency-and-image-scan:
    name: Dependency, configuration and image scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate ephemeral local credentials
        run: ./scripts/security/init-secret-env.sh local

      - name: Build application images
        run: |
          for attempt in 1 2 3; do
            if docker compose build backend frontend; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Docker Compose image build failed after 3 attempts."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::Image build attempt ${attempt} failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Prepare centralized Trivy result path
        run: mkdir -p test-results/security/trivy/evidence/reports

      - name: Scan repository dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: test-results/security/trivy/evidence/reports/repository.json
          exit-code: '0'

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inventory-security-${{ github.run_id }}-backend:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: test-results/security/trivy/evidence/reports/backend-image.json
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inventory-security-${{ github.run_id }}-frontend:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: test-results/security/trivy/evidence/reports/frontend-image.json
          exit-code: '0'

      - name: Enforce vulnerability quality gate
        run: |
          jq -e '
            [
              .[]
              | .Results[]?
              | (.Vulnerabilities[]?, .Misconfigurations[]?)
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")
            ]
            | length == 0
          ' --slurp test-results/security/trivy/evidence/reports/*.json

      - name: Create exportable Trivy summary
        if: always()
        run: |
          status=failed
          if [ "${{ job.status }}" = success ]; then status=passed; fi
          if [ "${{ job.status }}" = cancelled ]; then status=cancelled; fi
          python3 scripts/testing/collect_test_results.py \
            --suite security/trivy \
            --status "$status" \
            --metadata "workflow=Security Testing" \
            --metadata "run=${{ github.run_id }}" \
            --metadata "sha=${{ github.sha }}" \
            --metadata "format=trivy-json"

      - name: Verify Trivy report safety
        id: trivy_artifact_safety
        if: always()
        run: ./scripts/security/verify-artifacts.sh test-results/security/trivy

      - name: Upload safe Trivy reports
        if: always() && steps.trivy_artifact_safety.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-security-trivy-${{ github.run_number }}
          path: test-results/security/trivy/**
          if-no-files-found: error
          retention-days: 14

  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate ephemeral artifact-scan credentials
        run: ./scripts/security/init-secret-env.sh local

      - name: Build Docker Compose application images
        if: inputs.target_url == ''
        run: |
          for attempt in 1 2 3; do
            if docker compose build backend frontend; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Docker Compose image build failed after 3 attempts."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::Image build attempt ${attempt} failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Start Docker Compose stack
        if: inputs.target_url == ''
        run: docker compose up --no-build --wait --wait-timeout 240 -d

      - name: Verify Compose frontend health
        if: inputs.target_url == ''
        env:
          FRONTEND_URL: http://frontend:8080
        run: |
          docker compose exec -T frontend sh -c 'wget -qO- http://127.0.0.1:8080/health >/dev/null'

      - name: Run ZAP baseline against the Compose stack
        if: inputs.target_url == ''
        env:
          ZAP_TARGET_URL: http://frontend:8080
          ZAP_DOCKER_NETWORK: inventory-security-${{ github.run_id }}_inventory-network
          ZAP_REPORT_DIR: test-results/security/zap/evidence/reports
        run: tests/security/run-zap-baseline.sh

      - name: Run ZAP baseline against staging
        if: inputs.target_url != ''
        env:
          ZAP_TARGET_URL: ${{ inputs.target_url }}
          ZAP_DOCKER_NETWORK: bridge
          ZAP_REPORT_DIR: test-results/security/zap/evidence/reports
        run: tests/security/run-zap-baseline.sh

      - name: Collect Docker Compose diagnostics
        if: always() && inputs.target_url == ''
        run: |
          mkdir -p test-results/security/zap/evidence/logs
          docker compose logs --no-color > test-results/security/zap/evidence/logs/compose.log || true

      - name: Create exportable ZAP summary
        if: always()
        run: |
          status=failed
          if [ "${{ job.status }}" = success ]; then status=passed; fi
          if [ "${{ job.status }}" = cancelled ]; then status=cancelled; fi
          python3 scripts/testing/collect_test_results.py \
            --suite security/zap \
            --status "$status" \
            --metadata "workflow=Security Testing" \
            --metadata "run=${{ github.run_id }}" \
            --metadata "sha=${{ github.sha }}" \
            --metadata "format=zap-json-markdown"

      - name: Verify security artifact safety
        id: security_artifact_safety
        if: always()
        run: ./scripts/security/verify-artifacts.sh test-results/security/zap

      - name: Upload centralized safe ZAP results
        if: always() && steps.security_artifact_safety.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-security-zap-${{ github.run_number }}
          path: test-results/security/zap/**
          if-no-files-found: error
          retention-days: 14

      - name: Stop Docker Compose stack
        if: always() && inputs.target_url == ''
        run: docker compose down -v --remove-orphans
