name: Playwright E2E

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: inventory-e2e-${{ github.run_id }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm 10.12.1
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Start Docker Compose stack
        working-directory: ${{ github.workspace }}
        run: docker compose up --build --wait --wait-timeout 240 -d

      - name: Wait for E2E stack
        env:
          E2E_MANAGE_STACK: 'true'
        run: pnpm run stack:ready

      - name: Run Playwright tests
        env:
          E2E_MANAGE_STACK: 'false'
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/playwright-results.xml
        run: pnpm exec playwright test

      - name: Collect Docker Compose diagnostics
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p tests/e2e/test-results/docker
          docker compose ps > tests/e2e/test-results/docker/compose-ps.txt || true
          docker compose logs --no-color > tests/e2e/test-results/docker/compose.log || true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_number }}
          path: |
            tests/e2e/playwright-report/**
            tests/e2e/test-results/**
            tests/e2e/ux-evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Playwright evidence
        if: always()
        run: |
          {
            echo "## Playwright evidence"
            echo ""
            echo "- Command: \`pnpm exec playwright test\`"
            echo "- HTML report: \`tests/e2e/playwright-report/index.html\`"
            echo "- JUnit report: \`tests/e2e/test-results/playwright-results.xml\`"
            echo "- Failure assets: \`tests/e2e/test-results/**\`"
            echo "- Accessibility, keyboard, responsive and browser evidence: \`tests/e2e/ux-evidence/**\`"
            echo "- Browser matrix: Chromium, Firefox and WebKit"
            echo "- Responsive matrix: 412x839, 768x1024 and 1440x900"
            echo "- Artifact: \`playwright-e2e-${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Docker Compose stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose down -v --remove-orphans
