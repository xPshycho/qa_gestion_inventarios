name: Playwright E2E

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: inventory-e2e-${{ github.run_id }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm 10.12.1
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Chromium binary
        run: |
          CHROME_PATH="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$CHROME_PATH" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${CHROME_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Install Playwright ffmpeg
        run: pnpm exec playwright install ffmpeg

      - name: Install Playwright Chromium
        if: env.PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH == ''
        run: pnpm exec playwright install chromium

      - name: Generate ephemeral local credentials
        working-directory: ${{ github.workspace }}
        run: ./scripts/security/init-secret-env.sh local

      - name: Start Docker Compose stack
        working-directory: ${{ github.workspace }}
        run: docker compose up --build --wait --wait-timeout 240 -d

      - name: Wait for E2E stack
        env:
          E2E_MANAGE_STACK: 'true'
        run: pnpm run stack:ready

      - name: Run Playwright tests
        env:
          E2E_MANAGE_STACK: 'false'
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/playwright-results.xml
          PLAYWRIGHT_RETAIN_SENSITIVE_ARTIFACTS: 'false'
          PLAYWRIGHT_SAFE_REPORTING: 'true'
        run: pnpm exec playwright test

      - name: Collect Docker Compose diagnostics
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p tests/e2e/test-results/docker
          docker compose ps > tests/e2e/test-results/docker/compose-ps.txt || true
          docker compose logs --no-color > tests/e2e/test-results/docker/compose.log || true

      - name: Verify artifact safety
        id: artifact_safety
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/security/verify-artifacts.sh tests/e2e/test-results

      - name: Upload safe Playwright artifacts
        if: always() && steps.artifact_safety.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_number }}
          path: |
            tests/e2e/test-results/playwright-results.xml
            tests/e2e/test-results/docker/**
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Playwright evidence
        if: always()
        run: |
          {
            echo "## Playwright evidence"
            echo ""
            echo "- Command: \`pnpm exec playwright test\`"
            echo "- JUnit report: \`tests/e2e/test-results/playwright-results.xml\`"
            echo "- Artifact safety: \`${{ steps.artifact_safety.outcome }}\`"
            echo "- Artifact: \`playwright-e2e-${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Docker Compose stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose down -v --remove-orphans
