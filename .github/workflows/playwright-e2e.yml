name: Playwright E2E

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: inventory-e2e-${{ github.run_id }}
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble
  PLAYWRIGHT_CONTAINER_NAME: inventory-playwright-${{ github.run_id }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm 10.12.1
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull pinned Playwright browser image
        timeout-minutes: 10
        working-directory: ${{ github.workspace }}
        run: docker pull "$PLAYWRIGHT_IMAGE"

      - name: Generate ephemeral local credentials
        working-directory: ${{ github.workspace }}
        run: ./scripts/security/init-secret-env.sh local

      - name: Start Docker Compose stack
        working-directory: ${{ github.workspace }}
        run: docker compose up --build --wait --wait-timeout 240 -d

      - name: Wait for E2E stack
        env:
          E2E_MANAGE_STACK: 'true'
        run: pnpm run stack:ready

      - name: Run Playwright tests in browser image
        timeout-minutes: 20
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm --init --ipc=host --network=host \
            --name "$PLAYWRIGHT_CONTAINER_NAME" \
            --volume "${{ github.workspace }}:/work" \
            --workdir /work/tests/e2e \
            --env CI=true \
            --env E2E_MANAGE_STACK=false \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --env PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/playwright-results.xml \
            --env PLAYWRIGHT_RETAIN_SENSITIVE_ARTIFACTS=false \
            --env PLAYWRIGHT_SAFE_REPORTING=true \
            "$PLAYWRIGHT_IMAGE" \
            /work/tests/e2e/node_modules/.bin/playwright test

      - name: Normalize Playwright artifact ownership
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          for path in tests/e2e/test-results tests/e2e/ux-evidence; do
            if [ -e "$path" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done

      - name: Collect Docker Compose diagnostics
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p tests/e2e/test-results/docker
          docker compose ps > tests/e2e/test-results/docker/compose-ps.txt || true
          docker compose logs --no-color > tests/e2e/test-results/docker/compose.log || true

      - name: Verify artifact safety
        id: artifact_safety
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/security/verify-artifacts.sh \
            tests/e2e/test-results \
            tests/e2e/ux-evidence

      - name: Upload safe Playwright artifacts
        if: always() && steps.artifact_safety.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_number }}
          path: |
            tests/e2e/test-results/playwright-results.xml
            tests/e2e/test-results/docker/**
            tests/e2e/ux-evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Playwright evidence
        if: always()
        run: |
          {
            echo "## Playwright evidence"
            echo ""
            echo "- Runtime: \`${PLAYWRIGHT_IMAGE}\`"
            echo "- Command: \`playwright test\`"
            echo "- JUnit report: \`tests/e2e/test-results/playwright-results.xml\`"
            echo "- Artifact safety: \`${{ steps.artifact_safety.outcome }}\`"
            echo "- Accessibility, keyboard, responsive and browser evidence: \`tests/e2e/ux-evidence/**\`"
            echo "- Browser matrix: Chromium, Firefox and WebKit"
            echo "- Responsive matrix: 412x839, 768x1024 and 1440x900"
            echo "- Artifact: \`playwright-e2e-${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Docker Compose stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          docker rm -f "$PLAYWRIGHT_CONTAINER_NAME" 2>/dev/null || true
          docker compose down -v --remove-orphans
