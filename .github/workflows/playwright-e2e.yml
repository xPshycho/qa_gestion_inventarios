name: Playwright E2E

on:
  push:
    branches:
      - main
      - develop
      - staging
      - 'feature/**'
      - 'test/**'
      - 'ci/**'
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: inventory-e2e-${{ github.run_id }}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm 10.12.1
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Docker Compose stack
        working-directory: ${{ github.workspace }}
        run: docker compose up --build --wait --wait-timeout 240 -d

      - name: Wait for E2E stack
        env:
          E2E_MANAGE_STACK: 'true'
        run: pnpm run stack:ready

      - name: Run Playwright tests
        env:
          E2E_MANAGE_STACK: 'false'
        run: pnpm exec playwright test

      - name: Collect Docker Compose diagnostics
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p tests/e2e/test-results/docker
          docker compose ps > tests/e2e/test-results/docker/compose-ps.txt || true
          docker compose logs --no-color > tests/e2e/test-results/docker/compose.log || true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_number }}
          path: |
            tests/e2e/playwright-report/**
            tests/e2e/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Docker Compose stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose down -v --remove-orphans
