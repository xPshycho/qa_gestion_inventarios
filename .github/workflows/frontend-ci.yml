name: Frontend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm 10.12.1
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Resolve Chromium binary
        run: |
          CHROME_PATH="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome or Chromium binary was found on the runner." >&2
            exit 1
          fi
          echo "CHROME_BIN=${CHROME_PATH}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: pnpm exec ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      - name: Collect centralized frontend test results
        if: always()
        working-directory: .
        run: |
          status=failed
          if [ "${{ job.status }}" = success ]; then status=passed; fi
          if [ "${{ job.status }}" = cancelled ]; then status=cancelled; fi
          python3 scripts/testing/collect_test_results.py \
            --suite frontend/unit \
            --status "$status" \
            --coverage frontend/coverage/qa-gestion-inventarios-frontend/coverage-summary.json \
            --copy coverage=frontend/coverage \
            --metadata "workflow=Frontend CI" \
            --metadata "run=${{ github.run_id }}" \
            --metadata "sha=${{ github.sha }}" \
            --metadata "junit=not-generated-by-karma"

      - name: Upload centralized frontend test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-frontend-unit-${{ github.run_number }}
          path: test-results/frontend/unit/**
          if-no-files-found: error
          retention-days: 14

      - name: Summarize frontend evidence
        if: always()
        run: |
          {
            echo "## Frontend evidence"
            echo ""
            echo "- Command: \`pnpm exec ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage\`"
            echo "- Central path: \`test-results/frontend/unit/\`"
            echo "- Coverage report: \`evidence/coverage/qa-gestion-inventarios-frontend/index.html\`"
            echo "- Exportable summary: \`summary.json\` and \`metrics.prom\`"
            echo "- Artifact: \`test-results-frontend-unit-${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-diagnostics-${{ github.run_number }}
          path: |
            frontend/dist/**
            frontend/npm-debug.log*
            frontend/pnpm-debug.log*
            frontend/.angular/cache/**/*.log
          if-no-files-found: ignore
          retention-days: 14
