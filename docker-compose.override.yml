services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-55432}:5432"

  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  keycloak:
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

  frontend:
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

  prometheus:
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
