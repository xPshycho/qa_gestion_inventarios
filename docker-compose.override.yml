services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-55432}:5432"

  backend:
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  keycloak:
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

  frontend:
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

  prometheus:
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  alloy:
    ports:
      - "${ALLOY_HTTP_PORT:-12345}:12345"

  loki:
    ports:
      - "${LOKI_PORT:-3100}:3100"

  tempo:
    ports:
      - "${TEMPO_PORT:-3200}:3200"

  alertmanager:
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
