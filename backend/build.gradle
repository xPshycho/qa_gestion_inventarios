plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '7.3.0.8198'
}

group = 'com.pucmm'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    apiTestImplementation.extendsFrom testImplementation
    apiTestRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('resolveBuildDependencies') {
    doLast {
        configurations.annotationProcessor.resolve()
        configurations.compileClasspath.resolve()
        configurations.runtimeClasspath.resolve()
    }
}

sourceSets {
    apiTest {
        java.srcDir 'src/apiTest/java'
        resources.srcDir 'src/apiTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }

    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        resources.srcDir '../infra/keycloak'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.hibernate.orm:hibernate-envers'

    // OAuth2 Resource Server (JWT)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql:42.7.12'

    // Security overrides for CVEs fixed after the Spring Boot 3.5.14 BOM release.
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.55'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // OpenTelemetry
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.rest-assured:spring-mock-mvc'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:1.20.4"
        mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.28.1"
    }
}

tasks.withType(Test).configureEach {
    systemProperty 'otel.sdk.disabled', 'true'
    systemProperty 'otel.traces.exporter', 'none'
    systemProperty 'otel.metrics.exporter', 'none'
    systemProperty 'otel.logs.exporter', 'none'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

tasks.register('apiTest', Test) {
    description = 'Ejecuta la suite dedicada de API testing con RestAssured'
    group = 'verification'
    testClassesDirs = sourceSets.apiTest.output.classesDirs
    classpath = sourceSets.apiTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Ejecuta las pruebas de integracion con dependencias reales'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('apiTest')
    useJUnitPlatform()
    jacoco {
        destinationFile = layout.buildDirectory.file('jacoco/integrationTest.exec').get().asFile
    }
    finalizedBy tasks.named('jacocoIntegrationTestReport')
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

tasks.register('jacocoIntegrationTestReport', JacocoReport) {
    mustRunAfter tasks.named('integrationTest')
    executionData layout.buildDirectory.file('jacoco/integrationTest.exec')
    sourceSets sourceSets.main

    onlyIf {
        executionData.files.any { it.exists() }
    }

    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file(
                'reports/jacoco/integrationTest/jacocoIntegrationTestReport.xml'
        )
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/integrationTest/html')
    }
}

tasks.register('jacocoIntegrationTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('integrationTest')
    executionData layout.buildDirectory.file('jacoco/integrationTest.exec')
    sourceSets sourceSets.main

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('apiTest')
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('jacocoIntegrationTestCoverageVerification')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

sonar {
    properties {
        property 'sonar.projectKey', 'xPshycho_qa_gestion_inventarios'
        property 'sonar.organization', 'xpshycho'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                'build/reports/jacoco/test/jacocoTestReport.xml,' +
                'build/reports/jacoco/integrationTest/jacocoIntegrationTestReport.xml'
        property 'sonar.java.source', '21'
    }
}
