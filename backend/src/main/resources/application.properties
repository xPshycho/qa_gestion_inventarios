spring.application.name=qa-gestion-inventarios

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:inventory_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cambiar}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=rev_type
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}

# MDC values are populated by Micrometer Tracing and CorrelationIdFilter.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-} user=%X{user:-} endpoint=%X{endpoint:-} %logger{36} - %msg%n

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/inventory}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8081/realms/inventory/protocol/openid-connect/certs}

inventory.keycloak.admin-url=${KEYCLOAK_ADMIN_URL:http://localhost:8081}
inventory.keycloak.admin-realm=${KEYCLOAK_ADMIN_REALM:inventory}
inventory.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:inventory-admin-service}
inventory.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:cambiar-admin-service}

inventory.cors.allowed-origins=${INVENTORY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
