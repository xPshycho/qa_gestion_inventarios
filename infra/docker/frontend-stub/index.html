<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Gestion de Inventarios</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 720px);
        padding: 32px;
        border: 1px solid #d7dde8;
        border-radius: 8px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.1;
      }

      p {
        margin: 0 0 20px;
        color: #465264;
        line-height: 1.6;
      }

      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 10px 16px;
        margin: 0;
      }

      dt {
        font-weight: 700;
      }

      dd {
        margin: 0;
        color: #465264;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sistema de Gestion de Inventarios</h1>
      <p>Frontend temporal para validar el entorno local con Docker Compose.</p>
      <dl>
        <dt>Servicio</dt>
        <dd>frontend-stub</dd>
        <dt>Estado</dt>
        <dd>Disponible</dd>
        <dt>API local</dt>
        <dd>http://localhost:8080</dd>
      </dl>
    </main>
  </body>
</html>
