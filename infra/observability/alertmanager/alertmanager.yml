route:
  receiver: local-observability
  group_by: [alertname, service, severity]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: local-observability
      group_wait: 5s

receivers:
  # Local receiver: alerts remain inspectable in Alertmanager without secrets.
  - name: local-observability
