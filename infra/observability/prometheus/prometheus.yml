global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: inventory-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: inventory-keycloak
    metrics_path: /metrics
    static_configs:
      - targets:
          - keycloak:9000
