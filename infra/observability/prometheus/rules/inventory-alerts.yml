groups:
  - name: inventory-platform
    rules:
      - alert: InventoryBackendDown
        expr: up{job="inventory-backend"} == 0
        for: 1m
        labels: { severity: critical, service: inventory-backend }
        annotations:
          summary: Backend de inventario no disponible
      - alert: InventoryHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="inventory-backend",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="inventory-backend"}[5m])), 0.001) > 0.05
        for: 2m
        labels: { severity: warning, service: inventory-backend }
        annotations:
          summary: Tasa de errores HTTP superior al 5 por ciento
      - alert: InventoryHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="inventory-backend"}[5m])) by (le)) > 1
        for: 5m
        labels: { severity: warning, service: inventory-backend }
        annotations:
          summary: Latencia HTTP P95 superior a un segundo
      - alert: InventoryHighCpu
        expr: process_cpu_usage{job="inventory-backend"} > 0.85
        for: 5m
        labels: { severity: warning, service: inventory-backend }
        annotations:
          summary: CPU del backend superior al 85 por ciento
      - alert: InventoryDatabasePoolSaturated
        expr: hikaricp_connections_active{job="inventory-backend"} / clamp_min(hikaricp_connections_max{job="inventory-backend"}, 1) > 0.9
        for: 5m
        labels: { severity: warning, service: inventory-backend }
        annotations:
          summary: Pool de conexiones de base de datos saturado
