<main class="product-page page-shell">
  <mat-card class="page-heading-card">
    <mat-card-content class="page-heading-content">
      <div>
        <p class="eyebrow">Productos</p>
        <h1>Editar producto</h1>
        <p class="page-subtitle">Actualiza la información general del producto.</p>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="form-panel" aria-labelledby="product-form-title">
    <mat-card-content>
      <h2 id="product-form-title">Información del producto</h2>

      <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

      <div *ngIf="loading" class="page-message" role="status">
        Cargando producto...
      </div>

      <div *ngIf="errorMessage" class="page-message page-message-error" role="alert">
        {{ errorMessage }}
      </div>

      <app-product-form
        *ngIf="productValue && !loading"
        submitLabel="Guardar cambios"
        [initialValue]="productValue"
        [currentStockReadonly]="true"
        [submitting]="saving"
        (saveProduct)="updateProduct($event)"
      ></app-product-form>

      <a *ngIf="!loading && !productValue" routerLink="/productos" class="secondary-action" mat-stroked-button>
        Volver al catálogo
      </a>
    </mat-card-content>
  </mat-card>
</main>
