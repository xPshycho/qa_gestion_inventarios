<header *ngIf="auth.isAuthenticated()" class="application-header">
  <div class="header-content">
    <a class="brand" routerLink="/">Inventario empresarial</a>

    <nav aria-label="Modulos principales">
      <a
        *ngIf="auth.hasPermission('report:view')"
        routerLink="/dashboard"
        routerLinkActive="active-link"
      >
        Dashboard
      </a>
      <a
        *ngIf="auth.hasPermission('product:view')"
        routerLink="/productos"
        routerLinkActive="active-link"
      >
        Productos
      </a>
    </nav>

    <div class="user-session">
      <div>
        <strong>{{ auth.user()?.displayName }}</strong>
        <span>{{ auth.user()?.username }}</span>
      </div>
      <button type="button" (click)="logout()" [disabled]="logoutInProgress">
        {{ logoutInProgress ? 'Cerrando...' : 'Cerrar sesion' }}
      </button>
    </div>
  </div>
</header>

<router-outlet></router-outlet>
